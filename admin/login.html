<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login — Sa Em Sromem</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            min-height: 100vh;

            display: flex;

            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background: #f4f6f8;
        }

        .login-box {
            width: 360px;

            background: white;

            padding: 35px;

            border-radius: 14px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .login-box h1 {
            text-align: center;

            margin-bottom: 8px;
        }

        .login-box p.subtitle {
            text-align: center;

            color: #777;

            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;

            margin-bottom: 7px;

            font-weight: 600;
        }

        input {
            width: 100%;

            padding: 12px;

            border: 1px solid #ddd;

            border-radius: 7px;

            font-size: 15px;
        }

        input:focus {
            outline: none;

            border-color: #111;
        }

        button {
            width: 100%;

            padding: 12px;

            border: none;

            border-radius: 7px;

            background: #111;

            color: white;

            font-size: 15px;

            cursor: pointer;
        }

        button:hover {
            background: #333;
        }

        .error {
            background: #ffe5e5;

            color: #d00;

            padding: 10px;

            border-radius: 6px;

            text-align: center;

            margin-bottom: 15px;
        }

        .back {
            display: block;

            text-align: center;

            margin-top: 20px;

            color: #555;

            text-decoration: none;
        }
    </style>

</head>


<body>

    <div class="login-box">

        <h1>
            Admin Login
        </h1>

        <p class="subtitle">
            Sa Em Sromem Portfolio
        </p>


        {% if error %}

        <div class="error">
            {{ error }}
        </div>

        {% endif %}


        <form action="/login" method="POST">

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input type="text" id="username" name="username" placeholder="Enter username" required>

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input type="password" id="password" name="password" placeholder="Enter password" required>

            </div>


            <button type="submit">
                Login
            </button>

        </form>


        <a href="/contact" class="back">
            ← Back to Contact
        </a>

    </div>

</body>

</html>
